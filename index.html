<!DOCTYPE html>
<html lang="en" data-theme="rainbow">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brave Book">
<meta name="theme-color" content="#FFF8F1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>My Brave Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ───────── Tokens ───────── */
:root{
  --p1:#FF6EB4;--p2:#9D5CFF;--p3:#4FA9FF;--p4:#3DCF97;--p5:#FFCF4D;--p6:#FF9C52;
  --bg:#FFF8F1;--surface:#FFFFFF;--surface-2:#F7F1FF;--ink:#30234A;--ink-2:#5F5278;--ink-3:#857A9C;--line:#EDE5F7;
  --btn1:color-mix(in srgb,var(--p1) 64%,#3a0030);--btn2:color-mix(in srgb,var(--p2) 78%,#1a0040);
  --accent:color-mix(in srgb,var(--p2) 85%,#000);
  --r-sm:12px;--r-md:18px;--r-lg:26px;
  --sh-1:0 1px 2px rgba(48,35,74,.05),0 6px 18px rgba(48,35,74,.06);
  --sh-2:0 2px 6px rgba(48,35,74,.06),0 16px 40px rgba(48,35,74,.12);
  --display:'Baloo 2',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:74px;
  --lv1:#45ADFF;--lv2:#33C687;--lv3:#FFC02E;--lv4:#FF8A3D;--lv5:#FF4F66;
}
html[data-theme=ocean]   {--p1:#14BFC6;--p2:#1E78B4;--p3:#4CD0DE;--p4:#58C7A8;--p5:#9FE3EC;--p6:#3BA0B5}
html[data-theme=sunset]  {--p1:#FF7A45;--p2:#E0418A;--p3:#FFB938;--p4:#FF9840;--p5:#FFC9A0;--p6:#F2545B}
html[data-theme=forest]  {--p1:#3DB86B;--p2:#1F8146;--p3:#8ED985;--p4:#E9BE36;--p5:#B8E26B;--p6:#7FA33A}
html[data-theme=galaxy]  {--p1:#F15BB5;--p2:#5B4BD1;--p3:#00B4F0;--p4:#9B5DE5;--p5:#FEE440;--p6:#7A5AF8}
html[data-theme=candy]   {--p1:#FF6FB5;--p2:#0FB3B3;--p3:#FFCA2C;--p4:#FF6B5B;--p5:#8FE3A1;--p6:#D37BE0}
html[data-theme=sunshine]{--p1:#FFB703;--p2:#E07000;--p3:#FFD166;--p4:#7CC97A;--p5:#FFE680;--p6:#F48C06}
html[data-theme=berry]   {--p1:#C2357A;--p2:#7A35B8;--p3:#9C5BD6;--p4:#E06AA8;--p5:#D9A6EA;--p6:#8A2FA0}
html[data-night]{--bg:#1B1730;--surface:#262040;--surface-2:#30294E;--ink:#F4EFFF;--ink-2:#C6BCE0;--ink-3:#8B81A8;--line:#3B335F;
  --accent:color-mix(in srgb,var(--p2) 55%,#fff);--sh-1:0 1px 2px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.25);--sh-2:0 16px 40px rgba(0,0,0,.4)}
html[data-size=large]{font-size:18px}

/* ───────── Base ───────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-weight:600;background:var(--bg);color:var(--ink);min-height:100dvh;line-height:1.5;overflow-x:hidden}
html[data-night] body{background:radial-gradient(1px 1px at 20% 12%,#fff8,transparent),radial-gradient(1px 1px at 70% 8%,#fff6,transparent),radial-gradient(1.5px 1.5px at 85% 22%,#fff7,transparent),radial-gradient(1px 1px at 40% 30%,#fff5,transparent),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}

/* ───────── Top bar ───────── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px)}
.topbar .hello{flex:1;min-width:0}
.topbar .hello b{display:block;font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .hello small{color:var(--ink-2);font-size:.8rem;font-weight:700}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);font:800 .9rem var(--body);border:0}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--sh-1);display:grid;place-items:center;font-size:1.2rem}
.saved{position:absolute;right:16px;top:calc(var(--safe-t) + 58px);font:800 .72rem var(--body);color:var(--ink-3);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* ───────── Main + tab bar ───────── */
main{max-width:980px;margin:0 auto;padding:6px 16px calc(var(--tab-h) + var(--safe-b) + 28px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 6px calc(6px + var(--safe-b));
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;border:0;background:none;min-height:58px;border-radius:16px;
  font:800 .72rem var(--body);color:var(--ink-2);position:relative;transition:color .2s}
.tab .ti{font-size:1.45rem;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:saturate(.6);opacity:.8}
.tab.on{color:var(--ink)}
.tab.on .ti{transform:translateY(-3px) scale(1.15);filter:none;opacity:1}
.tab.on::after{content:'';position:absolute;bottom:2px;width:18px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--p1),var(--p2))}
.tab.center .ti{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-top:-22px;font-size:1.6rem;opacity:1;filter:none;
  background:linear-gradient(140deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px color-mix(in srgb,var(--p2) 40%,transparent);border:4px solid var(--bg)}
.tab.center.on .ti{transform:translateY(-3px) scale(1.06)}
.tab.center.on::after{display:none}
.tab .badge{position:absolute;top:6px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:var(--lv5);border:2px solid var(--surface)}
@media (min-width:760px){
  .tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));width:min(640px,92vw);border-radius:30px;border:1px solid var(--line);box-shadow:var(--sh-2);padding:6px 10px}
  main{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 50px)}
  .topbar{padding-left:max(24px,calc(50% - 470px));padding-right:max(24px,calc(50% - 470px))}
}

/* ───────── Page heads & cards ───────── */
.view{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:14px;margin:8px 2px 18px}
.page-head .ph-ico{width:58px;height:58px;flex:none;border-radius:20px;display:grid;place-items:center;font-size:1.9rem;
  background:linear-gradient(140deg,color-mix(in srgb,var(--p1) 22%,var(--surface)),color-mix(in srgb,var(--p3) 22%,var(--surface)));box-shadow:var(--sh-1)}
.page-head h1{font-size:1.75rem;font-weight:800}
.page-head p{color:var(--ink-2);font-size:.95rem;line-height:1.35}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1);margin-bottom:16px;position:relative;overflow:hidden}
.card.tint{background:linear-gradient(150deg,color-mix(in srgb,var(--p1) 10%,var(--surface)),color-mix(in srgb,var(--p3) 10%,var(--surface)))}
.card h2{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.card h3{font-size:1.05rem;font-weight:800;margin:16px 0 8px}
.card > p, .p{color:var(--ink-2);font-size:.98rem}
.eyebrow{display:flex;align-items:center;gap:8px;font:900 .72rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.grid2{display:grid;gap:16px;align-items:start}
.grid2>.card{margin:0}
.stack>*+*{margin-top:16px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.85rem}

/* ───────── Buttons & inputs ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;
  font:800 1.02rem var(--display);transition:transform .12s ease,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--p2) 32%,transparent)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink-2);min-height:44px;padding:0 12px}
.btn-good{background:linear-gradient(135deg,color-mix(in srgb,var(--p4) 62%,#00302a),color-mix(in srgb,var(--p3) 66%,#002040));color:#fff}
.btn-danger{background:color-mix(in srgb,var(--lv5) 14%,var(--surface));color:var(--lv5)}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.speak{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--surface-2);font-size:1.05rem;display:inline-grid;place-items:center;vertical-align:middle}
.speak:active{transform:scale(.92)}
.field{display:block;margin-top:14px}
.field>span{display:block;font:800 .88rem var(--body);color:var(--accent);margin-bottom:6px}
.inp{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 14px;font:700 1.05rem var(--body);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.inp::placeholder{color:var(--ink-3);font-weight:600}
.inp:focus{border-color:color-mix(in srgb,var(--p2) 55%,var(--line));background:var(--surface)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.45}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .inp{padding:10px 14px}

/* ───────── Chips ───────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);
  font:800 .93rem var(--body);color:var(--ink-2);text-align:left;transition:all .18s}
.chip:active{transform:scale(.96)}
.chip.on{background:color-mix(in srgb,var(--p2) 13%,var(--surface));border-color:color-mix(in srgb,var(--p2) 55%,transparent);color:var(--ink)}
.chip.on .ck{background:var(--p2);color:#fff;border-color:var(--p2)}
.chip .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;font-size:.7rem;flex:none}
.chip .x{margin-left:2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.8rem;color:var(--ink-3)}
.chip.sel{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;border-color:transparent}

/* ───────── Hero / critter ───────── */
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:30px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--p1) 24%,var(--surface)),color-mix(in srgb,var(--p3) 22%,var(--surface)));box-shadow:var(--sh-1)}
.hero::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:color-mix(in srgb,var(--p5) 35%,transparent);filter:blur(10px)}
.hero-r{flex:1;min-width:0;position:relative}
.who{font:900 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px 4px}
.bubble{position:relative;background:var(--surface);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:var(--sh-1);font:800 1.02rem/1.4 var(--body);display:flex;gap:10px;align-items:flex-start}
.bubble span{flex:1}
.critter{flex:none;position:relative;border-radius:50%;display:grid;place-items:center;background:var(--halo);box-shadow:inset 0 -6px 14px rgba(0,0,0,.06),0 8px 22px color-mix(in srgb,var(--p2) 28%,transparent);animation:bob 3.4s ease-in-out infinite}
.critter>span{position:relative;z-index:1;line-height:1}
.critter.sm{width:44px;height:44px;font-size:1.6rem;animation:none}
.critter.md{width:96px;height:96px;font-size:3.4rem}
.critter.lg{width:150px;height:150px;font-size:5.4rem}
.critter.v-rainbow::before{content:'';position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#ffffffd0)}
.critter.sm.v-rainbow::before{inset:3px}
.critter .spark{position:absolute;font-style:normal;font-size:.32em;animation:twinkle 2s ease-in-out infinite;z-index:2}
.critter .spark.s1{top:4%;right:2%}.critter .spark.s2{bottom:10%;left:0;animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 .95rem var(--display)}

/* ───────── Session steps ───────── */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font:800 .82rem var(--body);color:var(--ink-2);min-height:48px}
.step .dot{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.75rem;color:var(--ink-3)}
.step.done{border-color:color-mix(in srgb,var(--p4) 45%,transparent);color:var(--ink)}
.step.done .dot{background:var(--p4);color:#fff}
.step.now{border-color:color-mix(in srgb,var(--p2) 55%,transparent);color:var(--ink)}
.step.now .dot{background:var(--p2);color:#fff}

/* ───────── Belly meter ───────── */
.meter-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.mbtn{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .2s}
.mbtn .me{font-size:2rem;line-height:1.1}
.mbtn .mn{font:800 1rem var(--display);color:color-mix(in srgb,var(--lv) 62%,var(--ink))}
.mbtn .ml{font:800 .66rem var(--body);color:var(--ink-2)}
.mbtn.on{border-color:var(--lv);background:color-mix(in srgb,var(--lv) 16%,var(--surface));transform:translateY(-4px);box-shadow:0 8px 18px color-mix(in srgb,var(--lv) 30%,transparent)}
.mbtn:active{transform:scale(.94)}
.meter-row.mini .mbtn{padding:6px 2px;border-radius:14px}.meter-row.mini .me{font-size:1.5rem}.meter-row.mini .ml{display:none}
.vmeter{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.vlv{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left;transition:all .2s}
.vlv .num{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--lv);color:#fff;font:800 1.3rem var(--display)}
.vlv .em{font-size:2rem}
.vlv .tx{flex:1}.vlv .tx b{display:block;font:800 1.05rem var(--display)}.vlv .tx small{color:var(--ink-2);font-size:.85rem;line-height:1.3;display:block}
.vlv.on{border-color:var(--lv);background:color-mix(in srgb,var(--lv) 14%,var(--surface))}
.vlv:active{transform:scale(.98)}
.timeline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--lv) 15%,var(--surface));font:800 .8rem var(--body)}
.tl i{font-style:normal}
.arrow{color:var(--ink-3);font-weight:900;align-self:center}
.lvl-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lv);vertical-align:middle}

/* ───────── Tiles (tools) ───────── */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.tiles.wide{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);text-align:left;min-height:118px;transition:transform .15s,border-color .2s}
.tile:active{transform:scale(.97)}
.tile .te{font-size:2rem;line-height:1}
.tile b{font:800 1rem var(--display);line-height:1.15}
.tile small{color:var(--ink-2);font-size:.8rem;line-height:1.3}
.tile .star{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:1.1rem;opacity:.35}
.tile .star.on{opacity:1}
.tile.fav{border-color:color-mix(in srgb,var(--p5) 70%,transparent);background:color-mix(in srgb,var(--p5) 10%,var(--surface))}

/* ───────── Calendar ───────── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.cal-head b{font:800 1.05rem var(--display)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font:900 .68rem var(--body);color:var(--ink-3);padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:50%;border:0;display:grid;place-items:center;font:800 .82rem var(--body);background:var(--surface-2);color:var(--ink-2)}
.cd.has{background:var(--lv,linear-gradient(135deg,var(--p1),var(--p2)));color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--lv,var(--p2)) 35%,transparent)}
.cd.full{outline:3px solid color-mix(in srgb,var(--p5) 85%,transparent);outline-offset:1px}
.cd.today{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--p2)}
.cd.future{opacity:.35}
.cd.blank{background:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font:800 .75rem var(--body);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ───────── Lists ───────── */
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:all .2s}
.check+.check{margin-top:8px}
.check .box{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--ink-3);display:grid;place-items:center;font-size:.9rem;color:#fff;transition:all .2s}
.check .ct{flex:1}.check .ct b{display:block;font:800 .98rem var(--body);line-height:1.3}.check .ct small{color:var(--ink-2);font-size:.82rem}
.check.on{border-color:color-mix(in srgb,var(--p4) 50%,transparent);background:color-mix(in srgb,var(--p4) 9%,var(--surface))}
.check.on .box{background:var(--p4);border-color:var(--p4);transform:scale(1.08)}
.check .del{border:0;background:none;color:var(--ink-3);font-size:1rem;width:32px;height:32px}
.bar{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}

function runBreath() {
  const B = BREATHS[SH.pattern || 'rainbow']; let round = 0, i = 0;
  const ball = $('#ball'), word = $('#bword'), cnt = $('#bcnt');
  const step = () => {
    if (!SH || !SH.running) return;
    if (i >= B.ph.length) { i = 0; round++; }
    if (round >= 3) { SH.running = false; SH.doneRounds = true; S.breaths++; save(); checkStickers(); renderSheet(); const w = $('#bword'); if (w) w.textContent = 'Great job! 🌈'; ding(); return; }
    const [lab, secs, scale] = B.ph[i];
    word.textContent = lab; cnt.textContent = `Round ${round + 1} of 3`;
    ball.style.transitionDuration = secs + 's'; ball.style.transform = `scale(${scale})`;
    chime(lab.startsWith('Breathe out') || lab.startsWith('Let') || lab.startsWith('Looong') ? 440 : 660, .4, .08);
    i++; breathT = setTimeout(step, secs * 1000);
  };
  step();
}
function logMeter(v, src) {
  const d = day(); const first = !d.meter;
  if (!d.first) d.first = (d.log && d.log[0] && +d.log[0].v) || v;
  d.peak = Math.max(peakOf(d), v);
  d.meter = v; (d.log = d.log || []).push({ v, t: hhmm(), src });
  save(); checkStickers();
  return first;
}

        <div><span><b>Adventure</b> — a new activity each day (random, no repeats for weeks). She can swap twice.</span></div>
        <div><span><b>Talk time</b> — she comes to find you. Keep it short and curious, not “how did that make you feel.”</span></div></div>
      <h3>When she shuts down</h3><p class="muted">Skip “what’s wrong?” Try: “I think your Worry ${esc(AN())} is here. That’s okay. I’m right here.” Presence first, words later (5–15 minutes).</p>
      <h3>After something hard</h3><p class="muted">Ask the magic question: “Did ${esc(WN())} know the truth — or did worry trick it?” Then add it to the Mischief Managed wall together. If it really was hard, say so — and praise the trying.</p>
      <h3>Preview Plans</h3><p class="muted">Make one the night before anything new. Past plans ask “How did it go?” and turn into wall entries automatically.</p>
      <h3>Updating the app</h3><p class="muted">Upload a new index.html to GitHub — the app picks it up next time it opens with internet. No need to re-add it to the home screen.</p>
      <p class="faint small mt16">Brave Book v${VERSION}</p>`;
  }
  return `${sheetHead('⚙️', 'For grown-ups')}${seg}${body}`;
}
function settingsForm(onboarding, step) {
  const c = S.cfg;
  const f = (k, l, ph) => `<label class="field"><span>${l}</span><input class="inp" data-bind="cfg.${k}" value="${esc(c[k])}" placeholder="${esc(ph)}"></label>`;
  const animals = `<div class="field"><span>Worry character</span><div class="opt-grid">${Object.entries(ANIMALS).map(([n, a]) => `<button class="opt ${c.animal === n ? 'on' : ''}" data-act="cfgAnimal" data-v="${n}"><span>${a.e}</span>${n}</button>`).join('')}</div></div>`;
  const themes = `<div class="field"><span>Color theme</span><div class="opt-grid">${THEMES.map(([id, l, g]) => `<button class="swatch ${c.theme === id ? 'on' : ''}" style="background:linear-gradient(135deg,${g})" data-act="cfgTheme" data-v="${id}">${l}</button>`).join('')}</div></div>`;
  const s1 = f('childName', 'Child’s name', 'e.g. Emma') + animals;
  const s2 = themes + f('artist', 'Favorite singer or band', 'e.g. Taylor Swift') + f('song', 'Favorite song', 'e.g. Shake It Off') + f('favActivity', 'Favorite activity', 'e.g. swimming, drawing') + f('favThing', 'Something else they love', 'e.g. dinosaurs, Lego');
  const s3 = `<p class="muted">Something that seemed scary but turned out okay? It becomes their first Mischief Managed moment. (Optional)</p>` + f('winWhat', 'The scary-seeming thing', 'e.g. the butterfly exhibit') + f('winResult', 'How it actually went', 'e.g. SO amazing!');
  if (onboarding) return [s1, s2, s3][step];
  return `<h3>About your child</h3>${s1}<h3>Favorites</h3>${s2}<h3>First brave moment</h3>${s3}`;
}

/* ───────── ONBOARDING ───────── */
let obStep = 0;
function vOnboarding() {
  if (!S.setupDone) {
    const titles = [['👋', 'Welcome, grown-up!', 'Let’s set up the Brave Book for your child. It takes 2 minutes. You can change anything later with ⚙️.'],
      ['🎨', 'Their favorites', 'These get woven into daily prompts, colors and activities.'], ['🦋', 'A first brave moment', '']];
    const [e, h, lead] = titles[obStep];
    return `<div class="ob view"><div class="dots">${[0, 1, 2].map(i => `<i class="${i === obStep ? 'on' : ''}"></i>`).join('')}</div>
      <div style="font-size:2.6rem">${e}</div><h1>${h}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}
      ${settingsForm(true, obStep)}
      <div class="foot">${obStep ? `<button class="btn btn-soft" data-act="obBack">← Back</button>` : ''}<button class="btn btn-primary" data-act="obNext">${obStep < 2 ? 'Next →' : 'Finish ✓'}</button></div></div>`;
  }
  return `<div class="ob view"><div class="welcome">${critterHTML('lg')}
      <h1>My Brave Book</h1><p class="lead">A book about big feelings & being brave</p>
      <label class="field" style="width:100%;max-width:360px;text-align:left"><span>This book belongs to…</span><input class="inp" id="kidName" value="${esc(S.cfg.childName)}" placeholder="Write your name ✨" style="text-align:center;font-size:1.3rem"></label>
      <button class="btn btn-primary" data-act="kidGo" style="min-width:220px">Let’s start! ${AE()} →</button></div></div>`;
}

/* ───────── RENDER ───────── */
const VIEWS = { today: vToday, critter: vCritter, belly: vBelly, tools: vTools, plans: vPlans, brave: vBrave };
function render() {
  applyLook();
  const root = $('#root');
  if (!S.setupDone || !S.childDone) { root.innerHTML = vOnboarding(); return; }
  const y = scrollY;
  root.innerHTML = topbar() + `<main id="main">${VIEWS[tab]()}</main>` + tabbar();
  if (render.keep) scrollTo(0, y); render.keep = false;
}
const rerender = () => { render.keep = true; render(); };

/* ───────── stickers ───────── */
function checkStickers(quiet) {
  const got = STICKERS.filter(s => !S.stickers[s.id] && s.t());
  if (!got.length) return;
  got.forEach(s => { S.stickers[s.id] = dkey(); S.newStickers.push(s.id); });
  save();
  if (((S.days[dkey()] || {}).meter || 0) >= 3) quiet = true; // no parties during big feelings — the NEW badge waits on the Brave tab
  if (!quiet) setTimeout(() => { toast(`🎖️ New sticker: ${tpl(got[0].e)} ${tpl(got[0].n)}${got.length > 1 ? ` (+${got.length - 1} more)` : ''}`, 3200); celebrate(); }, 500);
}

/* ───────── binding ───────── */
function resolve(path) {
  const parts = path.split('.'); let o, i = 0;
  if (parts[0] === 'day') { o = day(); i = 1; }
  else if (parts[0].startsWith('plan:')) { o = getPlan(parts[0].slice(5), true); i = 1; }
  else o = S;
  for (; i < parts.length - 1; i++) { const k = parts[i]; o = o[k] ?? (o[k] = /^\d+$/.test(parts[i + 1]) ? [] : {}); }
  return [o, parts[parts.length - 1]];
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]'); if (!el) return;
  const [o, k] = resolve(el.dataset.bind); if (!o) return;
  o[k] = el.value; save(); flashSaved();
  if (/^plan:.*\.title$/.test(el.dataset.bind) && el.value.trim()) checkStickers();
  if (el.dataset.bind === 'day.brave') { const b = $('[data-act=braveToHof]'); if (b && !day().braveHof) b.disabled = !el.value.trim(); }
  if (el.dataset.bind.startsWith('cfg.')) applyLook();
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile') importBackup(e.target.files[0]);
  const el = e.target.closest('[data-bind]');
  if (el && el.dataset.bind === 'critter.name') { checkStickers(); if (tab === 'critter' && !SH) rerender(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const t = (f.t?.value || '').trim(); if (!t) return;
  const kind = f.dataset.form;
  if (kind === 'addclue') S.critter.custom[f.dataset.g].push({ id: uid(), text: t, on: true });
  if (kind === 'addch') S.customCh.push({ id: uid(), t, lv: +f.dataset.lv, done: false });
  if (kind === 'addhof') { S.hof.push({ id: uid(), text: t, date: dkey() }); ding(); }
  save(); checkStickers(); rerender();
});

/* ───────── actions ───────── */
const ACT = {
  tab: el => { tab = el.dataset.tab; if (tab === 'brave' && S.newStickers.length) setTimeout(() => { S.newStickers = []; save(); }, 4000); render(); scrollTo(0, 0); },
  goTab: el => { closeSheet(); ACT.tab(el); },
  speak: el => speak(el.dataset.t),
  sheet: el => openSheet(el.dataset.s),
  closeSheet: () => closeSheet(),
  callGrown: () => { SH.call = true; renderSheet(); [523, 659, 523, 659].forEach((f, i) => setTimeout(() => chime(f, .5, .2), i * 420)); },
  calmBack: () => { SH.call = false; renderSheet(); },
  calmMeter: el => { const v = +el.dataset.v; logMeter(v, 'calm'); if (v <= 2) ding(); renderSheet(); toast(v <= 2 ? '🌈 So glad you’re feeling calmer' : '💛 Thanks for telling me'); },
  checkin: el => {
    const v = +el.dataset.v, first = logMeter(v, 'checkin');
    if (v <= 2) { first ? celebrate(false) : ding(); } else chime(523, .5, .07);
    rerender();
    const host = tab === 'today' ? '#c-check' : '.vmeter';
    if (v >= 3) setTimeout(() => $(`${tab === 'today' ? '#c-check' : '#main'} ${v >= 4 ? '.help' : '.tiles'}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
    else if (first && tab === 'today') setTimeout(() => $('#c-act')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
  },
  actDone: () => { const d = day(); d.actDone = !d.actDone; save(); afterStep(d.actDone, '#c-talk'); },
  talkDone: () => { const d = day(); d.talk = !d.talk; save(); afterStep(d.talk); },
  swap: () => { const d = day(); d.swaps = (d.swaps || 0) + 1; d.actId = pickAct(d.actId); d.answer = ''; save(); rerender(); },
  braveToHof: () => { const d = day(); if (!d.brave) return; S.hof.push({ id: uid(), text: d.brave, date: dkey() }); d.braveHof = true; save(); celebrate(false); checkStickers(); rerender(); toast('🏆 Added to your Hall of Fame!'); },
  cal: el => { calM += +el.dataset.d; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } rerender(); },
  dayview: el => openSheet('dayview', { k: el.dataset.k }),
  // critter
  variant: el => { S.critter.variant = el.dataset.v; save(); rerender(); },
  pickName: el => { S.critter.name = el.dataset.n; save(); checkStickers(); rerender(); },
  clue: el => { const a = S.critter.on[el.dataset.g], id = el.dataset.id, i = a.indexOf(id); i < 0 ? a.push(id) : a.splice(i, 1); save(); el.classList.toggle('on'); flashSaved(); },
  cclue: (el, e) => { if (e.target.closest('[data-act=delclue]')) return; const x = S.critter.custom[el.dataset.g].find(c => c.id === el.dataset.id); if (x) { x.on = !x.on; save(); el.classList.toggle('on'); } },
  delclue: el => { const g = el.dataset.g; S.critter.custom[g] = S.critter.custom[g].filter(c => c.id !== el.dataset.id); save(); rerender(); },
  // tools
  tool: el => { const t = toolById(el.dataset.id); if (!t) return; const cur = (S.days[dkey()] || {}).meter || null; openSheet('tool', { id: t.id, pattern: el.dataset.pattern || 'rainbow', before: cur, auto: !!cur }); },
  fav: (el, e) => { e.stopPropagation(); const a = S.tools.favs, id = el.dataset.id, i = a.indexOf(id); i < 0 ? a.push(id) : a.splice(i, 1); save(); SH ? renderSheet() : rerender(); },
  tmeter: el => {
    const v = +el.dataset.v; SH[el.dataset.w] = v; if (el.dataset.w === 'before') SH.auto = false;
    if (el.dataset.w === 'after') {
      logMeter(v, 'tool:' + SH.id);
      if (SH.before) { S.toolUses.push({ tool: SH.id, before: SH.before, after: v, date: dkey() }); save(); }
      const drop = SH.before ? SH.before - v : 0;
      SH.result = drop > 0 ? `🎉 Your belly went from ${SH.before} to ${v}! The tool helped!` : v <= 2 ? '🌈 Nice and calm. Great job!' : drop === 0 && SH.before ? '💛 Still the same — that’s okay. Try another tool, or find a grown-up.' : '💛 Thanks for checking. You can try another tool any time.';
      drop > 0 ? celebrate() : ding(); checkStickers();
    }
    renderSheet();
  },
  pattern: el => { stopTimers(); SH.pattern = el.dataset.p; SH.running = false; renderSheet(); },
  breathGo: () => { SH.running = true; renderSheet(); setTimeout(runBreath, 400); },
  breathStop: () => { stopTimers(); SH.running = false; renderSheet(); },
  finder: el => { const r = +el.dataset.r, i = +el.dataset.i; SH.finder[r] = SH.finder[r] === i + 1 ? i : i + 1; chime(600 + r * 80, .15, .08); renderSheet(); if (SH.finder.every((v, k) => v === 5 - k)) celebrate(false); },
  winNext: () => { SH.win = (SH.win || 0) + 1; renderSheet(); },
  timerGo: () => {
    const t = toolById(SH.id); if (SH.left === 0 || SH.left == null) SH.left = t.secs;
    SH.timing = true; renderSheet();
    timerT = setInterval(() => {
      SH.left--; const C = 2 * Math.PI * 88;
      const n = $('#tnum'), r = $('#tring'); if (n) n.textContent = SH.left; if (r) r.style.strokeDashoffset = C * (1 - SH.left / t.secs);
      if (SH.left <= 3 && SH.left > 0) chime(700, .12, .08);
      if (SH.left <= 0) { stopTimers(); SH.timing = false; SH.left = 0; S.moves = (S.moves || 0) + 1; save(); checkStickers(); renderSheet(); celebrate(false); }
    }, 1000);
  },
  timerStop: () => { stopTimers(); SH.timing = false; renderSheet(); },
  countUp: () => { const t = toolById(SH.id); SH.count = (SH.count || 0) + 1; chime(500 + SH.count * 40, .15, .1); if (SH.count >= t.count) { SH.count = t.count; S.moves = (S.moves || 0) + 1; save(); checkStickers(); celebrate(false); } renderSheet(); },
  countReset: () => { SH.count = 0; renderSheet(); },
  // plans
  addPlan: () => { const p = newPlan(); openSheet('plan', { id: p.id, draft: p }); },
  editPlan: el => openSheet('plan', { id: el.dataset.id }),
  planCheck: el => { const p = getPlan(el.dataset.id, true); const i = +el.dataset.i; p.checks[i] = !p.checks[i]; save(); if (p.checks.every(Boolean)) celebrate(false); renderSheet(); },
  ifChip: el => { const p = getPlan(el.dataset.id, true); p.ifWorry = p.ifWorry ? p.ifWorry + ', ' + el.dataset.t : el.dataset.t; save(); renderSheet(); },
  delPlan: el => { if (!SH.confirmDel) { SH.confirmDel = true; renderSheet(); return; } S.plans = S.plans.filter(p => p.id !== el.dataset.id); save(); closeSheet(); },
  followup: el => openSheet('followup', { id: el.dataset.id }),
  fuMeter: el => { SH.m = +el.dataset.v; renderSheet(); },
  fuR: el => { SH.note = $('#fuNote')?.value || SH.note; SH.r = el.dataset.r; renderSheet(); },
  fuSave: () => {
    const p = S.plans.find(x => x.id === SH.id), note = ($('#fuNote')?.value || '').trim();
    p.after = { result: SH.r, meter: SH.m || null, note, date: dkey() };
    if (SH.r === 'tricked') S.mischief.push({ id: uid(), said: p.worst || `${p.title || 'it'} would be scary`, actually: note || 'better than I thought!', date: dkey() });
    if (SH.r === 'brave' || SH.r === 'hard') S.hof.push({ id: uid(), text: `did ${p.title || 'something hard'} — ${note || 'even though it was hard!'}`, date: dkey() });
    const r = SH.r; save(); closeSheet(); celebrate(); checkStickers();
    toast(r === 'tricked' ? '🪄 Added to your Mischief Managed wall!' : '🏆 Added to your Hall of Fame!');
  },
  // brave
  stk: el => { openSheet('stk', { id: el.dataset.id }); },
  challenge: el => { const id = el.dataset.id; S.challenges[id] = !S.challenges[id]; save(); if (S.challenges[id]) celebrate(); checkStickers(); rerender(); },
  cch: (el, e) => { if (e.target.closest('[data-act=delcch]')) return; const c = S.customCh.find(x => x.id === el.dataset.id); c.done = !c.done; save(); if (c.done) celebrate(); rerender(); },
  delcch: (el, e) => { e.stopPropagation(); S.customCh = S.customCh.filter(c => c.id !== el.dataset.id); save(); rerender(); },
  addMM: () => openSheet('addMM'),
  saveMM: () => { const said = $('#mmSaid').value.trim(), act = $('#mmReal').value.trim(); if (!said && !act) return; S.mischief.unshift({ id: uid(), said, actually: act, date: dkey() }); save(); closeSheet(); celebrate(); checkStickers(); toast('🪄 Mischief Managed!'); },
  delMM: el => { if (el.dataset.c !== '1') { el.dataset.c = '1'; el.textContent = 'Delete?'; el.style.width = 'auto'; return; } S.mischief = S.mischief.filter(m => m.id !== el.dataset.id); save(); rerender(); },
  delHof: el => { if (el.dataset.c !== '1') { el.dataset.c = '1'; el.textContent = 'Delete?'; el.style.width = 'auto'; return; } S.hof = S.hof.filter(m => m.id !== el.dataset.id); save(); rerender(); },
  seenNew: () => { S.seen = VERSION; save(); closeSheet(); },
  // grown-ups
  gt: el => { SH.gt = el.dataset.t; SH.confirmReset = false; renderSheet(); $('#sheet').scrollTop = 0; },
  cfgAnimal: el => { S.cfg.animal = el.dataset.v; save(); SH ? renderSheet() : render(); },
  cfgTheme: el => { S.cfg.theme = el.dataset.v; save(); applyLook(); SH ? renderSheet() : render(); },
  cfgToggle: el => { S.cfg[el.dataset.k] = !S.cfg[el.dataset.k]; save(); renderSheet(); },
  cfgSize: () => { S.cfg.textSize = S.cfg.textSize === 'large' ? 'normal' : 'large'; save(); applyLook(); renderSheet(); },
  cfgNight: el => { S.cfg.night = el.dataset.v; save(); applyLook(); renderSheet(); },
  export: () => exportBackup(),
  reset: () => { if (!SH.confirmReset) { SH.confirmReset = true; renderSheet(); return; } localStorage.removeItem(KEY); S = fresh(); save(true); obStep = 0; closeSheet(); tab = 'today'; render(); },
  // onboarding
  obNext: () => { if (obStep === 0 && !S.cfg.childName.trim()) { toast('Please add your child’s name'); $('[data-bind="cfg.childName"]')?.focus(); return; }
    if (obStep < 2) { obStep++; render(); scrollTo(0, 0); return; }
    S.setupDone = true;
    if (S.cfg.winWhat && !S.mischief.length) { S.mischief.push({ id: uid(), said: `${S.cfg.winWhat} would be scary`, actually: S.cfg.winResult || 'better than I thought!', date: dkey(), first: true }); S.hof.push({ id: uid(), text: `was brave at ${S.cfg.winWhat} — and it was ${S.cfg.winResult || 'great'}!`, date: dkey(), first: true }); }
    save(); render(); },
  obBack: () => { obStep--; render(); },
  kidGo: () => { const n = $('#kidName').value.trim(); if (!n) { toast('Write your name first! ✏️'); return; } S.cfg.childName = n; S.childDone = true; save(); celebrate(); tab = 'today'; render(); },
};
function afterStep(on, sel) {
  const d = day();
  if (on && isFull(d)) { rerender(); celebrate(); checkStickers(); toast('🎯 All 3 steps done! Mischief Managed! 🪄', 3000); return; }
  if (on) ding();
  rerender(); checkStickers();
  if (on && sel) setTimeout(() => $(sel)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'LABEL') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' && el.closest('form') && el.type !== 'button' && !el.dataset.act) return;
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SH) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});

/* ───────── backup ───────── */
async function exportBackup() {
  const name = `brave-book-backup-${dkey()}.json`;
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Brave Book backup' }); toast('💾 Backup ready!'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('💾 Backup saved to Downloads');
}
function importBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || data.v !== 4 || !data.cfg) throw new Error('bad');
      if (!confirmImport()) return;
      S = deepMerge(fresh(), data); save(true); toast('✅ Backup restored!'); closeSheet(); render();
    } catch (e) { toast('⚠️ That file isn’t a Brave Book backup'); }
  };
  r.readAsText(file);
}
function confirmImport() { return window.confirm('Replace everything on this device with the backup?'); }

/* ───────── boot ───────── */
loadState();
checkStickers(true); S.newStickers = S.newStickers.filter(id => S.stickers[id]);
if (S.setupDone && S.childDone && S.seen !== VERSION) setTimeout(() => openSheet('whatsnew'), 600);
render();
setInterval(() => { const n = !!document.documentElement.hasAttribute('data-night'); if (n !== isNight() && !SH) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !SH && $('#main')) { const k = dkey(); if (render.lastDay && render.lastDay !== k) render(); render.lastDay = k; } });
render.lastDay = dkey();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => { }); });
    }).catch(() => { });
  });
}

</script>
